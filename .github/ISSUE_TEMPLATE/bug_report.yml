name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal project, commands, or a failing test.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, compiler, GPU and driver, build type.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
