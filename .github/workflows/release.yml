name: Release

# Publishes a GitHub Release when a version tag (v1.2.3) is pushed, or when
# started by hand with a tag name. Builds from source in CI so every
# published binary is traceable to a commit and a public build log.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and publish, e.g. v0.1.0 (created on the selected branch)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write  # create the release and upload assets
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check tag matches the project version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$env:TAG' is not of the form vX.Y.Z" }
          $tagVersion = $Matches[1]
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'VERSION (\d+\.\d+\.\d+)') { throw "No VERSION in CMakeLists.txt" }
          if ($Matches[1] -ne $tagVersion) { throw "Tag $env:TAG does not match project version $($Matches[1])" }
          $notes = "docs/releases/$env:TAG.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Test
        run: ctest --preset windows-msvc-release

      - name: Package
        shell: pwsh
        run: |
          $name = "aether-engine-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name/licenses" | Out-Null
          Copy-Item build/windows-msvc/samples/spinning_cubes/Release/aether_spinning_cubes.exe "dist/$name/"
          Copy-Item LICENSE, NOTICE "dist/$name/"
          Copy-Item third_party/licenses/* "dist/$name/licenses/"
          Copy-Item samples/spinning_cubes/README.md "dist/$name/README.md"
          "version: $env:TAG`ncommit: $env:GITHUB_SHA`nbuild log: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" |
            Out-File -Encoding utf8 "dist/$name/BUILD_INFO.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # Dependency manifest doubles as a minimal SBOM for this release.
          Copy-Item third_party/dependencies.json "dist/aether-engine-$env:TAG-dependencies.json"
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          $flags = @()
          if ($env:TAG -match '^v0\.') { $flags += '--prerelease' }  # pre-1.0 releases are previews
          gh release create $env:TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Aether Engine $env:TAG" `
            --notes-file "docs/releases/$env:TAG.md" @flags
